name: Python syntax check

on:
  push:
    branches: ["main", "vision/**"]
  pull_request:
    branches: ["main"]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile project Python files
        run: python -m compileall -q "RUN - The City AYATLA"
